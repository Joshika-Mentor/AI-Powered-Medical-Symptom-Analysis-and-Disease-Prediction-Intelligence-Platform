version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: medassist
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medassist_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medassist-network

  mongo:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - medassist-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
    environment:
      - DATABASE_URL=postgresql://medassist:password@db:5432/medassist_db
      - MONGO_URL=mongodb://admin:password@mongo:27017
    depends_on:
      - db
      - mongo
    networks:
      - medassist-network

volumes:
  postgres_data:
  mongo_data:

networks:
  medassist-network:
    driver: bridge

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - medassist-network
